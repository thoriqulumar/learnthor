# Learnthor frontend nginx config — serves the SPA and proxies /api to the
# backend container. The backend hostname "backend" is resolved by Docker's
# internal DNS (set in docker-compose.yml).

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: React Router owns client-side routing, so any path that
    # isn't a real file falls through to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API reverse proxy → Go backend (compose service name "backend").
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check (unauthenticated, useful for Docker healthchecks).
    location = /health {
        proxy_pass http://backend:8080/health;
    }

    # Gzip text responses.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
